[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topokpi-reproduction"
version = "1.0.0"
description = "Topology-aware self-supervised KPI anomaly detection and root-cause node localization"
readme = "README.md"
authors = [
  {name = "Debiao Luo"},
  {name = "Weijie Wang", email = "wangweijie@cdu.edu.cn"},
  {name = "Xinyue Liu"},
  {name = "Wen Yang"},
  {name = "Ke Hu"},
  {name = "Jia Zhang"}
]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "torch>=2.2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.optional-dependencies]
dev = []

[project.scripts]
topokpi = "topokpi.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/topokpi" = ["configs/*.json", "data/reported/manuscript_results.json"]
